context:
  version: "0.2.0"
  python_min: "3.12"

package:
  name: adsorption
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/Adsorption/releases/download/v${{ version }}/adsorption-${{ version }}.tar.gz
  sha256: 544ca1cbfffc29b977833b04ef0eb76427a138bf12eef8a25c03f4339a30a0b7

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - arrayff >=0.0.2
    - ase
    - graphatoms >=3.0
    - hydra-core >=1.1
    - joblib
    - numpy
    - pyyaml >=6
    - scikit-learn
    - scipy
    - typing-extensions

tests:
  - python:
      imports:
        - adsorption
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuGaoyong/Adsorption
  summary: The Python package for the adsorption of molecules on clusters or surfaces.
  description: |
    The Python package for the adsorption of molecules on clusters or surfaces.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/LiuGaoyong/Adsorption

extra:
  recipe-maintainers:
    - LiuGaoyong
