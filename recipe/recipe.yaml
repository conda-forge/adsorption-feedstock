context:
  version: "0.0.6"
  python_min: "3.12"

package:
  name: adsorption
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adsorption/adsorption-${{ version }}.tar.gz
  sha256: e4aa7ea63362ca85e32b0268181adfab3d154e3d85de7d54af7fd9df69d6898f

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - array-api-compat
    - ase
    - graphatoms >=1.1
    - hydra-core >=1.1
    - ray-default >=2.50
    - ray-tune >=2.50
    - typing-extensions

tests:
  - python:
      imports:
        - adsorption
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuGaoyong/Adsorption
  summary: The Python package for the adsorption of molecules on clusters or surfaces.
  description: |
    The Python package for the adsorption of molecules on clusters or surfaces.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/LiuGaoyong/Adsorption

extra:
  recipe-maintainers:
    - LiuGaoyong
