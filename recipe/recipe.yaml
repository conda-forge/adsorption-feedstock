context:
  version: "0.1.2"
  python_min: "3.12"

package:
  name: adsorption
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/Adsorption/releases/download/v${{ version }}/adsorption-${{ version }}.tar.gz
  sha256: fef43f2a06cbe4d4ba2ec60f055fb499915cd0907c748617221c81f957f3d29a

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - array-api-compat
    - ase
    - graphatoms >=1.1
    - hydra-core >=1.1
    - nequip >=0.16.1
    - pytorch
    - ray-default >=2.50
    - ray-tune >=2.50
    - typing-extensions

tests:
  - python:
      imports:
        - adsorption
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuGaoyong/Adsorption
  summary: The Python package for the adsorption of molecules on clusters or surfaces.
  description: |
    The Python package for the adsorption of molecules on clusters or surfaces.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/LiuGaoyong/Adsorption

extra:
  recipe-maintainers:
    - LiuGaoyong
